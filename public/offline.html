<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E88CA8" />
    <title>GlowCart - Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff5f7; color: #35252d; font: 16px/1.5 Arial, sans-serif; text-align: center; }
      main { max-width: 420px; padding: 28px; border-radius: 20px; background: white; }
      h1 { color: #bd5980; }
      a { display: inline-block; margin-top: 12px; color: #a64d72; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to load GlowCart services. Your saved cart remains on this device.</p>
      <a href="/">Try GlowCart again</a>
    </main>
  </body>
</html>

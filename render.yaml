services:
  - type: web
    name: glowcart-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: AUTH_SESSION_TTL_HOURS
        value: "168"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: glowcart-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://glowcart-api-slg5.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

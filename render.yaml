services:
  - type: web
    name: glowcart-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://glowcart-web.onrender.com

  - type: web
    name: glowcart-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://glowcart-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
